<title>王四木超会学</title>
<style>
:root{
  --pink-50:#fff8fa;
  --pink-100:#ffe8ef;
  --pink-200:#ffd6e4;
  --pink-300:#ffb8d0;
  --pink-400:#ff9bb8;
  --pink-500:#ff7aa3;
  --rose:#ff5e8e;
  --rose-deep:#e84d7d;
  --cream:#fff9fb;
  --text:#5b3a45;
  --text-soft:#8a6a76;
  --text-mute:#b89ba6;
  --line:#ffe4ed;
  --line-soft:#fff0f5;
  --shadow:0 10px 28px rgba(255,122,165,.18);
  --shadow-soft:0 4px 14px rgba(255,122,165,.12);
  --radius:22px;
  --radius-sm:16px;
  --radius-xs:10px;
  --green:#7fd1a8;
  --green-deep:#5fb589;
  --green-bg:#e8faf1;
  --red:#ff6b81;
  --red-bg:#ffe8ec;
  --orange:#ffb27a;
  --purple:#d9b3ff;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;background:#ffd6e4;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,"Hiragino Sans GB",sans-serif;}
body{display:flex;align-items:center;justify-content:center;}
button,input,textarea,select{font-family:inherit;border:none;outline:none;background:none;}
input,textarea,select{-webkit-user-select:text;user-select:text;}
button{cursor:pointer;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

.phone-shell{
  width:100%;max-width:430px;height:100vh;height:100dvh;
  background:linear-gradient(180deg,#fff8fa 0%,#ffe8ef 100%);
  position:relative;overflow:hidden;
  box-shadow:0 0 60px rgba(255,94,142,.25);
}
@media (min-width:500px){
  .phone-shell{height:92vh;height:92dvh;border-radius:36px;border:8px solid #fff;}
}

.status-bar{
  position:absolute;top:0;left:0;right:0;z-index:30;
  padding:calc(10px + var(--safe-top)) 18px 8px;
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:700;color:var(--text);
  background:linear-gradient(180deg,rgba(255,248,250,.95) 60%,rgba(255,248,250,0));
}
.status-bar .time{font-weight:800;letter-spacing:.5px;}
.status-bar .right{display:flex;align-items:center;gap:4px;}

.main{
  height:100%;overflow-y:auto;overflow-x:hidden;
  padding:calc(46px + var(--safe-top)) 16px calc(20px + var(--safe-bottom));
  scroll-behavior:smooth;
}

.main-head{
  display:flex;align-items:flex-start;justify-content:space-between;
  margin-bottom:12px;gap:10px;
}
.menu-btn{
  width:40px;height:40px;border-radius:14px;
  background:var(--pink-200);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;
  transition:transform .15s;
}
.menu-btn:active{transform:scale(.92);}
.menu-btn svg{width:20px;height:20px;color:var(--rose-deep);}
.main-head-center{flex:1;min-width:0;padding-top:1px;}
.page-title{font-size:21px;font-weight:800;color:var(--text);letter-spacing:.5px;}
.page-sub{font-size:11px;color:var(--text-soft);margin-top:5px;line-height:1.6;}
.add-btn{
  width:42px;height:42px;border-radius:50%;
  background:linear-gradient(135deg,var(--pink-400),var(--rose));
  color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;
  box-shadow:0 4px 14px rgba(255,94,142,.35);
  transition:transform .15s,box-shadow .15s;
}
.add-btn:active{transform:scale(.9);box-shadow:0 2px 8px rgba(255,94,142,.25);}
.add-btn svg{width:22px;height:22px;}

.card{
  background:#fff;border-radius:var(--radius);
  padding:18px;margin-bottom:14px;
  box-shadow:var(--shadow-soft);
}
.card-title{
  display:flex;align-items:center;gap:8px;
  font-size:15px;font-weight:700;color:var(--text);
  margin-bottom:14px;
}
.card-title svg{width:18px;height:18px;}
.card-title .tail{margin-left:auto;font-size:11px;color:var(--text-mute);font-weight:500;}

.countdown-card{
  background:linear-gradient(135deg,#ff9bb8,#ff6b9c);
  border-radius:var(--radius);padding:18px;color:#fff;
  box-shadow:0 10px 24px rgba(255,107,156,.35);
  margin-bottom:14px;position:relative;overflow:hidden;
}
.countdown-card::before{
  content:'';position:absolute;top:-30px;right:-30px;width:120px;height:120px;
  background:rgba(255,255,255,.15);border-radius:50%;
}
.countdown-card::after{
  content:'';position:absolute;bottom:-20px;right:40px;width:60px;height:60px;
  background:rgba(255,255,255,.12);border-radius:50%;
}
.cd-label{font-size:12px;opacity:.9;margin-bottom:4px;position:relative;z-index:1;}
.cd-row{display:flex;align-items:baseline;gap:4px;position:relative;z-index:1;}
.cd-num{font-size:48px;font-weight:800;line-height:1;}
.cd-unit{font-size:16px;font-weight:600;}
.cd-info{margin-top:10px;position:relative;z-index:1;}
.cd-name{font-size:16px;font-weight:700;}
.cd-date{font-size:12px;opacity:.85;margin-top:2px;}

/* 多倒计时垂直排列 */
.cd-scroll-wrap{
  display:flex;flex-direction:column;gap:10px;margin-bottom:14px;
}
.cd-scroll-wrap .countdown-card{
  width:100%;
  display:flex;flex-direction:row;align-items:center;gap:14px;
  padding:14px 18px;
}
.cd-scroll-wrap .countdown-card .cd-label{margin-bottom:0;flex-shrink:0;min-width:64px;}
.cd-scroll-wrap .countdown-card .cd-row{flex-shrink:0;}
.cd-scroll-wrap .countdown-card .cd-info{margin-top:0;flex:1;}
.cd-hero{
  background:linear-gradient(135deg,#ff7aa3,#ff4e7d) !important;
  box-shadow:0 12px 28px rgba(255,78,125,.4) !important;
}
.cd-today{
  font-size:11px;font-weight:700;
  background:rgba(255,255,255,.25);padding:4px 8px;border-radius:8px;
  display:inline-block;position:relative;z-index:1;flex-shrink:0;
}
.cd-expired{
  background:linear-gradient(135deg,#d0d0d0,#b0b0b0) !important;
  opacity:.7;
}
.cd-del-btn{
  position:absolute;top:8px;right:8px;
  width:22px;height:22px;border-radius:50%;
  background:rgba(255,255,255,.3);color:#fff;
  display:flex;align-items:center;justify-content:center;
  z-index:2;opacity:0;transition:opacity .2s;flex-shrink:0;
}
.cd-del-btn svg{width:12px;height:12px;}
.countdown-card:hover .cd-del-btn{opacity:1;}

.progress-wrap{background:var(--pink-50);border-radius:10px;height:10px;overflow:hidden;margin-bottom:10px;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--pink-400),var(--rose));border-radius:10px;transition:width .4s;}
.progress-text{font-size:12px;color:var(--text-soft);margin-bottom:12px;}
.progress-text b{color:var(--rose);font-weight:700;}

.plan-group{margin-bottom:12px;}
.plan-group-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.plan-group-icon{width:26px;height:26px;border-radius:8px;background:var(--pink-100);display:flex;align-items:center;justify-content:center;}
.plan-group-name{font-size:14px;font-weight:700;color:var(--text);}
.plan-group-count{margin-left:auto;font-size:12px;color:var(--rose);font-weight:700;}
.plan-task{
  display:flex;align-items:center;gap:10px;
  background:var(--pink-50);border-radius:var(--radius-xs);
  padding:11px 12px;margin-bottom:6px;
  border:1px solid var(--line-soft);
  transition:background .2s;
}
.plan-task.done{background:var(--green-bg);border-color:#d4f5e2;}
.plan-task .check{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--pink-300);background:#fff;
  transition:all .2s;
}
.plan-task.done .check{background:var(--green);border-color:var(--green);}
.plan-task .check svg{width:12px;height:12px;color:#fff;opacity:0;}
.plan-task.done .check svg{opacity:1;}
.plan-task .txt{flex:1;font-size:13px;color:var(--text);font-weight:500;}
.plan-task.done .txt{text-decoration:line-through;color:var(--text-mute);}
.plan-task .from{font-size:11px;color:var(--text-mute);white-space:nowrap;}
.plan-del-btn{
  width:24px;height:24px;border-radius:8px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  color:var(--text-mute);opacity:0;transition:opacity .2s;
}
.plan-del-btn:active{transform:scale(.9);}
.plan-del-btn svg{width:14px;height:14px;}
.plan-task:hover .plan-del-btn{opacity:.6;}

.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px;}
.stat-mini{
  background:linear-gradient(135deg,#fff,var(--pink-50));border-radius:var(--radius-sm);padding:14px 6px;text-align:center;
  box-shadow:var(--shadow-soft);border:1px solid var(--line-soft);
}
.stat-mini .num{font-size:20px;font-weight:800;color:var(--rose-deep);}
.stat-mini .txt{font-size:10px;color:var(--text-soft);margin-top:4px;}

.stat-tabs{display:flex;gap:4px;background:var(--pink-100);padding:4px;border-radius:14px;margin-bottom:14px;}
.stat-tab{flex:1;padding:8px;text-align:center;font-size:12px;font-weight:600;color:var(--text-soft);border-radius:10px;transition:all .2s;}
.stat-tab.active{background:#fff;color:var(--rose-deep);box-shadow:var(--shadow-soft);}

.input{
  width:100%;border:1.5px solid var(--line);border-radius:var(--radius-xs);
  padding:11px 12px;font-size:14px;background:#fff;color:var(--text);
  transition:border-color .2s;
}
.input:focus{border-color:var(--pink-400);}
.btn-pink{
  width:100%;background:linear-gradient(135deg,var(--pink-400),var(--rose));
  color:#fff;border-radius:var(--radius-xs);padding:13px;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 4px 12px rgba(255,94,142,.25);
  transition:transform .15s;
}
.btn-pink:active{transform:scale(.98);}

/* 添加记录卡片（参考倒计时卡片） */
.add-card{
  width:100%;border-radius:var(--radius);padding:16px;color:#fff;
  display:flex;align-items:center;justify-content:center;gap:14px;
  margin-top:12px;box-shadow:var(--shadow-soft);
  position:relative;overflow:hidden;cursor:pointer;
  transition:transform .15s,box-shadow .15s;
}
.add-card:active{transform:scale(.98);box-shadow:0 2px 8px rgba(255,122,165,.15);}
.add-card::before{
  content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;
  background:rgba(255,255,255,.12);border-radius:50%;
}
.add-card::after{
  content:'';position:absolute;bottom:-15px;right:40px;width:40px;height:40px;
  background:rgba(255,255,255,.08);border-radius:50%;
}
.add-card .add-icon{
  width:42px;height:42px;border-radius:50%;
  background:rgba(255,255,255,.22);
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;
}
.add-card .add-icon svg{width:24px;height:24px;}
.add-card .add-text{font-size:14px;font-weight:700;position:relative;z-index:1;}
.pill-add-btn{
  width:34px;height:34px;border-radius:50%;color:#fff;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;box-shadow:0 3px 8px rgba(124,196,232,.35);
  transition:transform .15s;
}
.pill-add-btn:active{transform:scale(.92);}
.pill-add-btn svg{width:16px;height:16px;}

.add-card.pink{background:linear-gradient(135deg,#ff9bb8,#ff6b9c);}
.add-card.green{background:linear-gradient(135deg,#7fd1a8,#5fb589);}
.add-card.blue{background:linear-gradient(135deg,#7fc4e8,#3a9fcf);}
.add-card.purple{background:linear-gradient(135deg,#d9b3ff,#b388ff);}
.add-card.orange{background:linear-gradient(135deg,#ffb27a,#e08a3a);}
.add-card.rose{background:linear-gradient(135deg,var(--pink-400),var(--rose));}

.drawer-mask{
  position:absolute;inset:0;background:rgba(91,58,69,.35);z-index:50;
  display:none;backdrop-filter:blur(2px);
}
.drawer-mask.show{display:block;}
.drawer{
  position:absolute;top:0;left:0;bottom:0;width:78%;max-width:300px;
  background:linear-gradient(180deg,#fff8fa 0%,#ffe8ef 100%);
  z-index:51;transform:translateX(-100%);transition:transform .3s cubic-bezier(.22,1,.36,1);
  display:flex;flex-direction:column;
  border-radius:0 24px 24px 0;box-shadow:8px 0 30px rgba(255,94,142,.2);
}
.drawer.open{transform:translateX(0);}
.drawer-head{
  padding:calc(20px + var(--safe-top)) 20px 16px;text-align:center;
  border-bottom:1px solid var(--line);
}
.drawer-avatar{
  width:72px;height:72px;border-radius:50%;margin:0 auto 10px;
  border:3px solid #fff;box-shadow:var(--shadow-soft);overflow:hidden;
}
.drawer-avatar img{width:100%;height:100%;object-fit:cover;}
.drawer-name{font-size:16px;font-weight:800;color:var(--rose-deep);}
.drawer-quote{font-size:10px;color:var(--text-soft);margin-top:6px;line-height:1.5;padding:0 10px;}
.drawer-body{flex:1;overflow-y:auto;padding:10px 14px;}
.drawer-group-title{
  font-size:10px;font-weight:700;color:var(--text-mute);letter-spacing:1.5px;
  padding:14px 8px 6px;display:flex;align-items:center;gap:6px;
}
.drawer-group-title svg{width:12px;height:12px;}
.drawer-item{
  display:flex;align-items:center;gap:10px;
  padding:11px 12px;border-radius:var(--radius-xs);
  font-size:13px;color:var(--text);margin-bottom:5px;
  background:#fff;border:1.5px solid transparent;
  box-shadow:0 2px 8px rgba(255,122,165,.06);
  transition:all .18s;
}
.drawer-item:active{transform:scale(.98);}
.drawer-item.active{background:linear-gradient(135deg,var(--pink-400),var(--rose));color:#fff;border-color:transparent;}
.drawer-item .ico{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--pink-100);}
.drawer-item.active .ico{background:rgba(255,255,255,.25);}
.drawer-item .ico svg{width:14px;height:14px;}
.drawer-item .label{flex:1;}

.drawer-foot{padding:10px 14px calc(12px + var(--safe-bottom));border-top:1px solid var(--line);}
.drawer-foot-btn{
  width:100%;padding:11px;border-radius:var(--radius-xs);font-size:13px;font-weight:700;
  background:#fff;color:var(--rose-deep);display:flex;align-items:center;justify-content:center;gap:6px;
  box-shadow:var(--shadow-soft);
}

.modal-mask{
  position:absolute;inset:0;background:rgba(91,58,69,.4);z-index:100;
  display:none;align-items:flex-end;justify-content:center;
}
.modal-mask.show{display:flex;}
.modal{
  background:#fff;border-radius:24px 24px 0 0;width:100%;
  padding:20px 20px calc(24px + var(--safe-bottom));
  max-height:80vh;overflow-y:auto;animation:slideUp .3s cubic-bezier(.22,1,.36,1);
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-title{font-size:16px;font-weight:800;color:var(--rose-deep);display:flex;align-items:center;gap:8px;}
.modal-close{width:32px;height:32px;border-radius:50%;background:var(--pink-100);display:flex;align-items:center;justify-content:center;transition:transform .15s;}
.modal-close:active{transform:scale(.9);}
.modal-close svg{width:14px;height:14px;color:var(--text-soft);}
.form-group{margin-bottom:14px;}
.form-label{font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:6px;display:block;}
.form-input,.form-textarea,.form-select{
  width:100%;border:1.5px solid var(--line);border-radius:var(--radius-xs);
  padding:12px 14px;font-size:14px;background:var(--pink-50);color:var(--text);
  transition:all .2s;
}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--pink-400);background:#fff;}
.form-textarea{resize:vertical;min-height:80px;}

.list-item{background:var(--pink-50);border-radius:var(--radius-xs);padding:10px 12px;margin-bottom:6px;font-size:13px;}
.tag{display:inline-block;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:700;margin-right:4px;}

.toast{
  position:absolute;top:calc(16px + var(--safe-top));left:50%;
  transform:translateX(-50%) translateY(-100px);
  background:rgba(91,58,69,.92);color:#fff;padding:10px 16px;border-radius:20px;
  font-size:13px;z-index:200;transition:transform .3s;max-width:90%;
}
.toast.show{transform:translateX(-50%) translateY(0);}

.file-input{position:absolute;width:0;height:0;opacity:0;}

/* 历史记录列表 */
.history-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;}
.history-day{
  background:var(--pink-50);border-radius:var(--radius-xs);
  padding:10px 12px;border:1px solid var(--line-soft);
}
.history-day-head{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:6px;padding-bottom:6px;border-bottom:1px dashed var(--line);
}
.history-date{font-size:13px;font-weight:700;color:var(--rose-deep);}
.history-total{font-size:11px;font-weight:600;color:var(--text-soft);background:#fff;padding:2px 8px;border-radius:8px;}
.history-sub-item{font-size:12px;color:var(--text-soft);padding:3px 0;line-height:1.5;}
.history-sub-item b{color:var(--text);font-weight:700;}

.err-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.err-tab{
  padding:7px 13px;border-radius:20px;font-size:11px;font-weight:600;
  background:var(--pink-50);color:var(--text-soft);border:1px solid var(--line);
  transition:all .2s;
}
.err-tab:active{transform:scale(.95);}
.err-tab.active{background:var(--rose);color:#fff;border-color:var(--rose);box-shadow:0 3px 8px rgba(255,94,142,.25);}
.err-list{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;}
.err-item{
  background:var(--pink-50);border:1px solid var(--line-soft);
  border-radius:var(--radius-xs);padding:10px 12px;
}
.err-item-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.err-type{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600;}
.err-type.text{background:var(--pink-200);color:var(--rose-deep);}
.err-type.voice{background:#e0f4ff;color:#3a9fcf;}
.err-type.photo{background:#ffe9d6;color:#e08a3a;}
.err-date{font-size:10px;color:var(--text-mute);margin-left:auto;}
.err-content{font-size:12px;color:var(--text);line-height:1.5;word-break:break-word;}
.err-photo{max-width:100%;border-radius:8px;margin-top:6px;display:block;}
.err-voice-bar{display:flex;align-items:center;gap:6px;margin-top:6px;background:#fff;padding:6px 8px;border-radius:8px;}
.err-voice-bar .play{width:24px;height:24px;border-radius:50%;background:#3a9fcf;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.err-voice-bar .play svg{width:12px;height:12px;color:#fff;}
.err-voice-bar .wave{flex:1;height:20px;display:flex;align-items:center;gap:2px;}
.err-voice-bar .wave span{flex:1;background:#3a9fcf;border-radius:2px;opacity:.6;}
.err-del{font-size:10px;color:var(--text-mute);margin-top:6px;cursor:pointer;float:right;}
.err-empty{text-align:center;padding:20px;color:var(--text-mute);font-size:12px;}

.voice-recorder{text-align:center;padding:20px;background:var(--pink-50);border-radius:var(--radius-sm);margin-bottom:12px;}
.rec-btn{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--pink-400),var(--rose));display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:var(--shadow-soft);}
.rec-btn.recording{animation:recPulse 1s infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,94,142,.5);}50%{box-shadow:0 0 0 12px rgba(255,94,142,0);}}
.rec-btn svg{width:24px;height:24px;color:#fff;}
.rec-status{font-size:12px;color:var(--text-soft);}

.backup-row{display:flex;gap:8px;margin-bottom:10px;}
.backup-btn{flex:1;padding:14px;border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;}
.backup-btn.export{background:var(--pink-100);color:var(--rose-deep);}
.backup-btn.import{background:#e7f7ee;color:var(--green-deep);}
.backup-btn svg{width:22px;height:22px;}
.backup-info{font-size:11px;color:var(--text-mute);text-align:center;padding:8px;background:var(--pink-50);border-radius:8px;margin-top:6px;}
.danger-zone{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);}
.danger-btn{width:100%;padding:10px;border-radius:10px;background:#fff0f0;color:#d32f2f;border:1px solid #ffcdd2;font-size:13px;font-weight:600;}

.duration-list{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto;}
.duration-item{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--pink-50);border-radius:var(--radius-xs);font-size:12px;border:1px solid var(--line-soft);}
.duration-item .d-date{color:var(--text-soft);min-width:75px;}
.duration-item .d-time{color:var(--text-soft);font-size:11px;min-width:95px;}
.duration-item .d-min{flex:1;font-weight:700;color:var(--rose-deep);}
.duration-item .d-del{color:var(--text-mute);font-size:11px;}

.more-btn{width:100%;padding:10px;margin-top:8px;border:1.5px dashed var(--line);border-radius:var(--radius-xs);background:var(--pink-50);color:var(--rose-deep);font-size:12px;font-weight:700;text-align:center;cursor:pointer;}
.more-btn:active{background:var(--pink-100);}
.collapse-extra{display:none;}

/* 收支明细（记账本） */
.fin-period{display:flex;gap:8px;margin-bottom:12px;}
.fin-tab{flex:1;padding:9px;border:1.5px solid var(--line);border-radius:var(--radius-xs);background:#fff;color:var(--text-soft);font-size:13px;font-weight:700;text-align:center;cursor:pointer;}
.fin-tab.active{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;border-color:var(--rose-deep);}
.fin-stats{display:flex;gap:10px;margin-bottom:10px;}
.fin-stat{flex:1;padding:12px;border-radius:var(--radius-sm);text-align:center;}
.fin-stat:first-child{background:rgba(127,209,168,.14);}
.fin-stat:last-child{background:rgba(255,107,129,.14);}
.fin-stat-label{font-size:11px;color:var(--text-soft);margin-bottom:4px;}
.fin-stat-num{font-size:19px;font-weight:800;}
.fin-stat-num.income{color:var(--green);}
.fin-stat-num.expense{color:var(--red);}
.fin-balance{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--pink-50);border-radius:var(--radius-xs);font-size:12px;color:var(--text-soft);}
.fin-balance b{font-size:16px;}
.fin-balance b.income{color:var(--green);}
.fin-balance b.expense{color:var(--red);}
.fin-list{display:flex;flex-direction:column;gap:6px;}
.fin-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--pink-50);border:1px solid var(--line-soft);border-radius:var(--radius-xs);}
.fin-info{flex:1;min-width:0;}
.fin-cat{font-size:13px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.fin-note{font-size:11px;font-weight:400;color:var(--text-mute);}
.fin-date{font-size:10px;color:var(--text-mute);margin-top:2px;}
.fin-amt{font-size:14px;font-weight:800;white-space:nowrap;}
.fin-amt.income{color:var(--green);}
.fin-amt.expense{color:var(--red);}
.fin-edit,.fin-del{width:30px;height:30px;flex-shrink:0;border:none;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.fin-edit svg{width:16px;height:16px;color:var(--rose);}
.fin-del svg{width:16px;height:16px;color:var(--text-mute);}
.csv-btn{display:flex;align-items:center;justify-content:center;gap:6px;border-style:solid;border-color:var(--rose);}
.csv-btn svg{width:15px;height:15px;}

/* 记账本输入框 */
.fin-input-row{display:flex;gap:8px;margin-bottom:8px;width:100%;box-sizing:border-box;}
.fin-amt-input{width:90px;flex-shrink:0;border:1.5px solid var(--line);border-radius:var(--radius-xs);padding:9px 12px;font-size:16px;background:#fff;color:var(--text);box-sizing:border-box;}
.fin-note-input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:var(--radius-xs);padding:9px 12px;font-size:14px;background:#fff;color:var(--text);box-sizing:border-box;}

/* 记账本按日分组 */
.fin-day{border:1px solid var(--line-soft);border-radius:var(--radius-xs);background:var(--pink-50);overflow:hidden;margin-bottom:6px;}
.fin-day-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#fff;cursor:pointer;}
.fin-day-title{font-size:13px;font-weight:800;color:var(--text);}
.fin-day-count{font-size:11px;color:var(--text-mute);background:var(--pink-50);padding:2px 6px;border-radius:10px;}
.fin-day-sum{font-size:13px;font-weight:700;}
.fin-day-sum.income{color:var(--green);}
.fin-day-sum.expense{color:var(--red);}
.fin-day-arrow{width:16px;height:16px;color:var(--text-mute);display:flex;align-items:center;justify-content:center;transition:transform .2s;}
.fin-day-arrow svg{width:14px;height:14px;}
.fin-day.collapsed .fin-day-body{display:none;}
.fin-day.collapsed .fin-day-arrow{transform:rotate(-90deg);}
.fin-day-body{display:flex;flex-direction:column;gap:4px;padding:8px;}

/* 健康管理子 tab */
.health-tabs{display:flex;gap:6px;margin-bottom:14px;}
.health-tab{flex:1;padding:8px 4px;border:1.5px solid var(--line);border-radius:var(--radius-xs);background:#fff;color:var(--text-soft);font-size:12px;font-weight:700;text-align:center;cursor:pointer;transition:all .2s;}
.health-tab.active{background:linear-gradient(135deg,#7fd1a8,#5fb589);color:#fff;border-color:#5fb589;}

/* 医美记录 */
.cosmed-section{margin-bottom:16px;}
.cosmed-section-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.cosmed-section-title .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.cosmed-item{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;background:var(--pink-50);border:1px solid var(--line-soft);border-radius:var(--radius-xs);margin-bottom:6px;}
.cosmed-item .ci-main{flex:1;min-width:0;font-size:12px;color:var(--text);line-height:1.6;}
.cosmed-item .ci-date{font-size:11px;color:var(--text-mute);}
.cosmed-item .ci-org{font-weight:700;color:var(--rose-deep);}

/* 美瞳有效期 */
.lens-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--pink-50);border:1px solid var(--line-soft);border-radius:var(--radius-xs);margin-bottom:6px;}
.lens-item.warn{background:#fff4e6;border-color:#ffcc80;}
.lens-item.expired{background:#ffe8ec;border-color:#ff6b81;}
.lens-item .li-main{flex:1;min-width:0;}
.lens-item .li-model{font-size:13px;font-weight:700;color:var(--text);}
.lens-item .li-date{font-size:11px;color:var(--text-mute);margin-top:2px;}
.lens-item .li-days{font-size:13px;font-weight:800;white-space:nowrap;}
.lens-item.warn .li-days{color:#e08a3a;}
.lens-item.expired .li-days{color:#d63031;}

/* 月经周期 */
.period-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--pink-50);border:1px solid var(--line-soft);border-radius:var(--radius-xs);margin-bottom:6px;}
.period-item .pi-main{flex:1;min-width:0;font-size:12px;color:var(--text);line-height:1.6;}
.period-item .pi-date{font-weight:700;color:var(--rose-deep);}
.period-item .pi-gap{font-size:11px;color:#e08a3a;font-weight:600;}

/* 健康管理表单通用约束 —— 全部单列堆叠，绝对不超框 */
.health-form-row{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;width:100%;box-sizing:border-box;}
.health-form-field{display:flex;flex-direction:column;gap:5px;width:100%;min-width:0;box-sizing:border-box;}
.health-form-field label{font-size:12px;font-weight:700;color:var(--rose-deep);}
.health-form-field input,
.health-form-field textarea,
.health-form-field select{
  width:100%;
  min-width:0;
  max-width:100%;
  box-sizing:border-box;
  border:1.5px solid var(--line);
  border-radius:var(--radius-xs);
  padding:10px 12px;
  font-size:14px;
  background:#fff;
  font-family:inherit;
  color:var(--text);
}
/* 关键：iOS Safari date input 强制约束 */
.health-form-field input[type="date"]{
  min-width:0;
  max-width:100%;
  width:100%;
  font-size:14px;
  padding:10px 12px;
  -webkit-appearance:none;
  appearance:none;
  box-sizing:border-box;
}
.health-form-field input[type="number"]{
  min-width:0;
  max-width:100%;
  width:100%;
  font-size:14px;
  padding:10px 12px;
  box-sizing:border-box;
}
/* 健康管理所有 input 都加显式边框，确保边界清晰 */
#mainBody .health-form-field input,
#mainBody .health-form-field textarea,
#mainBody .health-form-field select{border:1.5px solid var(--line) !important;}

.time-input-row{display:flex;gap:10px;margin-bottom:4px;}
.time-field{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.time-field label{font-size:11px;font-weight:700;color:var(--rose-deep);}
.time-input-wrap{width:100%;min-width:0;box-sizing:border-box;border:1.5px solid var(--line);border-radius:var(--radius-xs);padding:4px;background:#fff;overflow:hidden;height:42px;display:flex;align-items:center;justify-content:center;}
.time-input{width:100%;min-width:0;border:none;padding:0;font-size:15px;background:transparent;color:var(--text);text-align:center;-webkit-appearance:none;appearance:none;height:100%;}

.chart-box{background:var(--pink-50);border-radius:var(--radius-sm);padding:12px;border:1px solid var(--line-soft);}
.chart-box svg{width:100%;height:auto;display:block;}

.plan-input-row{display:flex;gap:6px;margin-bottom:12px;}
.plan-input-row input{
  flex:1;border:1.5px solid var(--line);border-radius:var(--radius-xs);
  padding:10px 12px;font-size:13px;background:#fff;color:var(--text);
  transition:border-color .2s;
}
.plan-input-row input:focus{border-color:var(--pink-400);}
.plan-input-row select{
  border:1.5px solid var(--line);border-radius:var(--radius-xs);
  padding:10px 8px;font-size:12px;background:#fff;color:var(--text);min-width:70px;
}

/* 学习计划专用输入区 */
.plan-input-area{margin-bottom:12px;}
.plan-input-main{
  width:100%;border:1.5px solid var(--line);border-radius:var(--radius-xs);
  padding:12px 14px;font-size:14px;background:#fff;color:var(--text);
  margin-bottom:8px;transition:border-color .2s;
}
.plan-input-main:focus{border-color:var(--pink-400);}
.plan-input-actions{display:flex;gap:8px;align-items:center;}
.plan-input-select{
  border:1.5px solid var(--line);border-radius:var(--radius-xs);
  padding:10px 12px;font-size:13px;background:#fff;color:var(--text);
  flex:1;
}
.plan-add-circle{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--pink-400),var(--rose));
  color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(255,94,142,.3);
  transition:transform .15s;
}
.plan-add-circle:active{transform:scale(.9);}
.plan-add-circle svg{width:20px;height:20px;}
.btn-add{
  background:linear-gradient(135deg,var(--pink-400),var(--rose));color:#fff;
  border-radius:var(--radius-xs);padding:0 14px;font-size:13px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:4px;flex-shrink:0;
  box-shadow:0 3px 10px rgba(255,94,142,.2);
  transition:transform .15s;
}
.btn-add:active{transform:scale(.94);}
.clock-row{display:flex;gap:8px;align-items:center;margin-bottom:12px;}
.clock-row input{flex:1;border:1.5px solid var(--line);border-radius:var(--radius-xs);padding:9px 12px;font-size:13px;background:#fff;}
</style>
</head>

const STORE_KEY = 'wb_wangsimu_v1';
let DB = {};
function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function timeStr(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function dateStr(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}

function loadDB(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){ DB = JSON.parse(raw); }
  }catch(e){ DB = {}; }
  if(!DB.navOrder){ DB.navOrder = MODULES.map(m=>m.id); }
  // 自动补充新增模块到 navOrder（兼容旧数据）
  MODULES.forEach(m=>{
    if(!DB.navOrder.includes(m.id)){
      // 找到同组的最后一个模块位置，插在后面
      const sameGroup = DB.navOrder.filter(id => MODULES.find(x=>x.id===id && x.group===m.group));
      if(sameGroup.length > 0){
        const lastIdx = DB.navOrder.lastIndexOf(sameGroup[sameGroup.length-1]);
        DB.navOrder.splice(lastIdx+1, 0, m.id);
      }else{
        DB.navOrder.push(m.id);
      }
      saveDB();
    }
  });
  if(!DB.modules) DB.modules = {};
  if(!DB.countdowns){
    // 预置示例倒计时
    const now = new Date();
    const d1 = new Date(now); d1.setDate(d1.getDate()+120);
    const d2 = new Date(now); d2.setDate(d2.getDate()+60);
    const d3 = new Date(now); d3.setDate(d3.getDate()+200);
    DB.countdowns = [
      { id:'c_demo1', name:'教招考试', date:dateStr(d1) },
      { id:'c_demo2', name:'教资考试', date:dateStr(d2) },
      { id:'c_demo3', name:'研究生考试', date:dateStr(d3) },
    ];
  }
  if(!DB.synced) DB.synced = false;
}

function saveDB(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
  catch(e){ toast('存储失败：'+e.message); }
  // 自动同步：保存后 5 秒自动上传
  scheduleAutoPush();
}

function getModuleData(id){
  if(!DB.modules[id]){
    DB.modules[id] = { stats:[], plans:[], errors:[], durations:[], lifeRecords:[] };
    saveDB();
  }
  if(!DB.modules[id].durations) DB.modules[id].durations = [];
  if(!DB.modules[id].lifeRecords) DB.modules[id].lifeRecords = [];
  return DB.modules[id];
}

let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  el.innerHTML = '<span>'+msg+'</span>';
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

function renderNav(){
  const list = document.getElementById('navList');

    html += `<div class="drawer-group-title">${GROUP_ICONS[g]||''}<span>${g}</span></div>`;
    const ids = DB.navOrder.filter(id => MODULES.find(m=>m.id===id && m.group===g));
    ids.forEach(id=>{
      const m = MODULES.find(x=>x.id===id);
      html += `<div class="drawer-item ${currentModule===id?'active':''}" data-id="${id}" onclick="switchModule('${id}')">

        <span class="label">${m.name}</span>

  });
  list.innerHTML = html;
}

function switchModule(id){
  currentModule = id;
  document.querySelectorAll('.drawer-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.id===id);
  });
  const m = MODULES.find(x=>x.id===id);
  document.getElementById('pageTitle').textContent = m.name;
  const subs = {daily:'通过考试就能得到的东西，<br>和天上掉馅饼有什么区别', food:'好好吃饭，才有力气学习～'};

    body.innerHTML = renderDaily();
  }else if(['food','fitness','pill','sleep','notes','finance'].includes(currentModule)){
    body.innerHTML = renderLife(currentModule);
  }else{
    body.innerHTML = renderSubject(currentModule);

  checkBackupPrompt();
}

function renderDaily(){
  const today = todayStr();
  // 计算"昨日"日期
  const yest = new Date(today+'T00:00:00');
  yest.setDate(yest.getDate()-1);
  const yesterday = yest.getFullYear()+'-'+String(yest.getMonth()+1).padStart(2,'0')+'-'+String(yest.getDate()).padStart(2,'0');

  let todayItems = [], yesterdayItems = [], overdueItems = [], historyItems = [];
  DB.navOrder.forEach(id=>{
    const m = MODULES.find(x=>x.id===id);
    if(!m || (m.type!=='subject' && m.type!=='life')) return;
    const md = DB.modules[id]; if(!md) return;
    md.plans.forEach(p=>{
      if(!p.done){
        if(p.date===today) todayItems.push({...p, moduleId:id, moduleName:m.name, color:m.color});
        else if(p.date===yesterday) yesterdayItems.push({...p, moduleId:id, moduleName:m.name, color:m.color});
        else if(p.date<yesterday) overdueItems.push({...p, moduleId:id, moduleName:m.name, color:m.color});
        // 注意：过期但属于 3 天内的，归到历史里；超过 7 天的，归到历史并标灰
      }
    });
  });

  // 按日期排序所有倒计时
  const sortedCds = DB.countdowns.map(c=>({
    ...c,
    days: Math.ceil((new Date(c.date) - new Date(today+'T00:00:00')) / 86400000)
  })).sort((a,b)=>a.days - b.days);
  const upcomingCds = sortedCds.filter(c=>c.days >= 0);
  const expiredCds = sortedCds.filter(c=>c.days < 0);

  let todayMinutes = 0;
  Object.keys(DB.modules).forEach(id=>{
    (DB.modules[id].durations||[]).forEach(d=>{ if(d.date===today) todayMinutes += d.min; });
  });

  return `
    ${upcomingCds.length > 0 ? `
      <div class="cd-scroll-wrap">
        ${upcomingCds.map((c,i)=>`
          <div class="countdown-card ${i===0?'cd-hero':''}" onclick="openCountdownModal()">
            ${i===0 ? '<div class="cd-label">最近考试</div>' : '<div class="cd-label">考试倒计时</div>'}
            <div class="cd-row"><div class="cd-num">${c.days}</div><div class="cd-unit">天</div></div>
            <div class="cd-info">
              <div class="cd-name">${c.name}</div>
              <div class="cd-date">${c.date}</div>
            </div>
            ${c.days===0 ? '<div class="cd-today">就是今天！加油！</div>' : ''}
            <button class="cd-del-btn" onclick="event.stopPropagation();delCountdown('${c.id}')">${ICONS.close}</button>
          </div>
        `).join('')}
        ${expiredCds.length > 0 ? expiredCds.map(c=>`
          <div class="countdown-card cd-expired" onclick="openCountdownModal()">
            <div class="cd-label">已结束</div>
            <div class="cd-row"><div class="cd-num" style="font-size:24px">完</div></div>
            <div class="cd-info"><div class="cd-name">${c.name}</div><div class="cd-date">${c.date}</div></div>
            <button class="cd-del-btn" onclick="event.stopPropagation();delCountdown('${c.id}')">${ICONS.close}</button>
          </div>
        `).join('') : ''}
      </div>
    ` : `
      <div class="countdown-card" onclick="openCountdownModal()">
        <div class="cd-label">考试倒计时</div>
        <div class="cd-row"><div class="cd-num">+</div></div>
        <div class="cd-info"><div class="cd-name">点击添加考试</div></div>
      </div>
    `}

    <div class="card">
      <div class="card-title">${ICONS.plan}今日计划总览
        <span class="tail">${todayItems.length} 项待办</span>
      </div>
      ${todayItems.length>0 ? `
        <div class="progress-wrap"><div class="progress-bar" style="width:0%"></div></div>
        <div class="progress-text">已完成 <b>0</b> / ${todayItems.length} 项 · 完成率 <b>0%</b></div>
        ${renderPlanGroups(todayItems, today, 'today')}
      ` : `<div style="text-align:center;padding:14px;color:var(--text-mute);font-size:13px">今天暂无待办，去各模块添加计划吧～</div>`}
    </div>

    <div class="card">
      <div class="card-title">${ICONS.clock}昨日计划
        <span class="tail">${yesterdayItems.length} 项</span>
      </div>
      ${yesterdayItems.length>0 ? `
        <div style="font-size:11px;color:var(--text-soft);margin-bottom:8px">${yesterday} · 还没完成的会自动归到历史</div>
        ${renderPlanGroups(yesterdayItems, today, 'yesterday')}
      ` : `<div style="text-align:center;padding:12px;color:var(--text-mute);font-size:12px">昨天没有未完成的计划 🎉</div>`}
    </div>

    <div class="card">
      <div class="card-title">${ICONS.note}历史计划
        <span class="tail">${overdueItems.length} 项逾期</span>
      </div>
      ${overdueItems.length>0 ? `
        <div style="font-size:11px;color:#ff5252;margin-bottom:8px">⚠️ 这些计划已逾期，建议尽快处理或删除</div>
        ${renderPlanGroups(overdueItems, today, 'history')}
      ` : `<div style="text-align:center;padding:12px;color:var(--text-mute);font-size:12px">没有逾期计划，做得很好 👍</div>`}
    </div>

    <div class="card">
      <div class="card-title">${ICONS.clock}今日学习时长
        <span class="tail">目标 240 分</span>
      </div>
      <div style="display:flex;align-items:center;gap:14px">
        <div style="flex:1">
          <div style="font-size:32px;font-weight:800;color:var(--rose-deep)">${todayMinutes}<span style="font-size:14px;font-weight:500;color:var(--text-soft)"> 分钟</span></div>
          <div class="progress-wrap" style="margin-top:10px"><div class="progress-bar" style="width:${Math.min(100,todayMinutes/240*100)}%"></div></div>
        </div>
        <div style="font-size:32px">${renderProgressRing(todayMinutes,240)}</div>
      </div>
      ${renderDailyDurationHistory()}
    </div>
  `;
}

function renderPlanGroups(items, today, mode){
  const groups = {};
  items.forEach(it=>{
    if(!groups[it.moduleName]) groups[it.moduleName] = {color:it.color, items:[]};
    groups[it.moduleName].items.push(it);
  });
  return Object.keys(groups).map(name=>`
    <div class="plan-group">
      <div class="plan-group-head">
        <span class="plan-group-icon" style="background:${groups[name].color}22"><span style="width:8px;height:8px;border-radius:50%;background:${groups[name].color}"></span></span>
        <span class="plan-group-name">${name}</span>
        <span class="plan-group-count">0/${groups[name].items.length}</span>
      </div>
      ${groups[name].items.map(it=>{
        let dateLabel = '';
        if(mode==='yesterday'){
          dateLabel = '<span class="from" style="color:#ff9800">昨日遗留</span>';
        } else if(mode==='history'){
          const days = Math.ceil((new Date(today+'T00:00:00') - new Date(it.date+'T00:00:00')) / 86400000);
          dateLabel = `<span class="from" style="color:#ff5252">逾期${days}天</span>`;
        } else {
          dateLabel = '<span class="from">待办</span>';
        }
        return `
        <div class="plan-task ${mode!=='today'?'overdue':''}">
          <div class="check" onclick="quickDone('${it.moduleId}','${it.id}')">${ICONS.check}</div>
          <div class="txt">${escapeHtml(it.name)}</div>
          ${dateLabel}
        </div>
      `}).join('')}
    </div>
  `).join('');
}

function renderDailyDurationHistory(){
  const byDate = {};
  Object.keys(DB.modules).forEach(id=>{
    (DB.modules[id].durations||[]).forEach(d=>{
      if(!byDate[d.date]) byDate[d.date] = 0;
      byDate[d.date] += d.min;
    });
  });
  const dates = Object.keys(byDate).sort().reverse();
  if(dates.length === 0){
    return `<div style="margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px">
      <div style="font-size:12px;font-weight:700;color:var(--rose-deep);margin-bottom:8px">历史学习时长（按日）</div>
      <div style="text-align:center;padding:10px;color:var(--text-mute);font-size:12px">还没有历史记录</div>
    </div>`;
  }
  const today = todayStr();
  const maxShow = 5;
  const items = dates.map(d=>{
    const min = byDate[d];
    const isToday = d === today;
    return `<div class="duration-item" style="${isToday?'border-color:var(--pink-300);background:var(--pink-100)':''}">
      <span class="d-date">${isToday?'今天':d}</span>
      <span class="d-min" style="flex:1;text-align:right">${min} 分钟</span>
      <span style="font-size:10px;color:var(--text-mute);min-width:36px;text-align:right">${(min/60).toFixed(1)}h</span>
    </div>`;
  });
  const needCollapse = items.length > maxShow;
  return `
    <div style="margin-top:14px;border-top:1px solid var(--line-soft);padding-top:12px">
      <div style="font-size:12px;font-weight:700;color:var(--rose-deep);margin-bottom:8px">历史学习时长（按日）</div>
      <div style="display:flex;flex-direction:column;gap:6px">
        ${items.slice(0, maxShow).join('')}
        ${needCollapse ? `<div class="collapse-extra" style="display:none">${items.slice(maxShow).join('')}</div>` : ''}
      </div>
      ${needCollapse ? `<button class="more-btn" onclick="toggleMore(this)"><span class="more-text">展开更多（共${items.length}天）</span></button>` : ''}
    </div>
  `;
}

function renderProgressRing(val, target){
  const pct = Math.min(1, val/target);
  const r = 26, c = 2*Math.PI*r;
  const off = c * (1-pct);
  return `<svg width="64" height="64" viewBox="0 0 64 64">
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#ffe0ea" stroke-width="6"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="#ff5e8e" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 32 32)"/>
    <text x="32" y="35" text-anchor="middle" font-size="11" font-weight="700" fill="#e84d7d">${Math.round(pct*100)}%</text>
  </svg>`;
}

      </div>

      </div>

    </div>

function setStatRange(r){ currentStatRange = r; renderMain(); }
function statSum(stats, range, field){
  const dates = rangeDates(range);
  return stats.filter(s=>dates.includes(s.date)).reduce((a,b)=>a+(b[field]||0),0);
}
function statAccuracy(stats, range){
  const dates = rangeDates(range);
  const filtered = stats.filter(s=>dates.includes(s.date));
  const c = filtered.reduce((a,b)=>a+(b.correct||0),0);
  const t = filtered.reduce((a,b)=>a+(b.count||0),0);
  return t>0 ? Math.round(c/t*100) : 0;
}
function durationSum(durations, range){
  const dates = rangeDates(range);
  return (durations||[]).filter(d=>dates.includes(d.date)).reduce((a,b)=>a+b.min,0);
}
function rangeDates(range){
  const now = new Date(); const dates = [];
  if(range==='day'){ dates.push(dateStr(now)); }
  else if(range==='week'){ for(let i=6;i>=0;i--){ const d = new Date(now); d.setDate(d.getDate()-i); dates.push(dateStr(d)); } }
  else if(range==='month'){ for(let i=29;i>=0;i--){ const d = new Date(now); d.setDate(d.getDate()-i); dates.push(dateStr(d)); } }
  return dates;
}
function renderStatChart(stats, range){
  const dates = rangeDates(range);
  const data = dates.map(d=>{ const s = stats.find(x=>x.date===d); return { date:d, count: s?s.count:0 }; });
  return drawLineChart(data, 'count');
}
function renderErrorChart(errors, range){
  const dates = rangeDates(range);
  const data = dates.map(d=>({ date:d, count: errors.filter(e=>e.date===d).length }));
  return drawLineChart(data, 'count');
}
function renderDurationChart(durations, range){
  const dates = rangeDates(range);
  const data = dates.map(d=>({ date:d, count: (durations||[]).filter(x=>x.date===d).reduce((a,b)=>a+b.min,0) }));
  return drawLineChart(data, 'count');
}
function drawLineChart(data, field){
  const W = 320, H = 120, P = 26;
  const vals = data.map(d=>d[field]||0);
  const max = Math.max(1, ...vals);
  const n = data.length;
  const stepX = n>1 ? (W-2*P)/(n-1) : 0;
  const points = data.map((d,i)=>{ const x = P + i*stepX; const y = H - P - (d[field]||0)/max * (H-2*P); return {x,y,d}; });
  let path = ''; points.forEach((p,i)=>{ path += (i===0?'M':'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1) + ' '; });
  let area = path + `L${points[points.length-1].x.toFixed(1)},${H-P} L${points[0].x.toFixed(1)},${H-P} Z`;
  let labels = '';
  const labelCount = n>10 ? 4 : n;
  for(let i=0;i<labelCount;i++){ const idx = Math.floor(i*(n-1)/Math.max(1,labelCount-1)); const p = points[idx]; labels += `<text x="${p.x}" y="${H-6}" text-anchor="middle" font-size="8" fill="#b89ba6">${data[idx].date.slice(5)}</text>`; }
  let dots = ''; points.forEach(p=>{ dots += `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#ff5e8e" stroke="#fff" stroke-width="1.5"/>`; });
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ff8fb5" stop-opacity=".4"/><stop offset="100%" stop-color="#ff8fb5" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#areaG)"/>
    <path d="${path}" fill="none" stroke="#ff5e8e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}${labels}
  </svg>`;
}

function renderPlanCard(id, m){
  const md = getModuleData(id);
  const today = todayStr();
  const plans = md.plans.filter(p=>p.date>=today || !p.done).sort((a,b)=>(a.done-b.done)||(a.date>b.date?1:-1));
  return `
    <div class="card">
      <div class="card-title">${ICONS.plan}学习计划
        <span class="tail">手动打卡</span>
      </div>
      <div class="plan-input-area">
        <input type="text" id="planInput_${id}" class="plan-input-main" placeholder="添加今日学习计划..." onkeypress="if(event.key==='Enter')addPlan('${id}')">
        <div class="plan-input-actions">
          <select id="planPri_${id}" class="plan-input-select">
            <option value="1">普通</option>
            <option value="0">重要</option>
          </select>
          <button class="plan-add-circle" onclick="addPlan('${id}')">${ICONS.add}</button>
        </div>
      </div>
      <div class="plan-list" id="planList_${id}">
        ${plans.length===0 ? `<div style="text-align:center;padding:20px;color:var(--text-mute);font-size:12px">还没有计划，添加一条开始吧～</div>` :
          plans.map(p=>`
            <div class="plan-task ${p.done?'done':''}">
              <div class="check" onclick="togglePlan('${id}','${p.id}')">${ICONS.check}</div>
              <div class="txt">${p.priority==0?'⭐ ':''}${escapeHtml(p.name)}</div>
              <span class="from">${p.date<today?'<span style="color:#ff5252">逾期</span>':(p.done?'已完成':'待办')}</span>
              <button class="plan-del-btn" onclick="delPlan('${id}','${p.id}')">${ICONS.del}</button>
            </div>
          `).join('')
        }

  `;
}

function addPlan(id){
  const input = document.getElementById('planInput_'+id);
  const pri = document.getElementById('planPri_'+id);
  const name = input.value.trim();
  if(!name){ toast('请输入计划内容'); return; }
  const md = getModuleData(id);
  md.plans.push({ id:'p'+Date.now(), name, done:false, date:todayStr(), priority:parseInt(pri.value) });
  saveDB(); input.value=''; renderMain();
  toast('计划已添加～');
}

function togglePlan(id, pid){
  const md = getModuleData(id);
  const p = md.plans.find(x=>x.id===pid);
  if(p){ p.done = !p.done; saveDB(); renderMain(); }
}

function delPlan(id, pid){
  showConfirm('删除这条计划？', ()=>{
    const md = getModuleData(id);
    md.plans = md.plans.filter(x=>x.id!==pid);
    saveDB(); renderMain();
  });
}

            </div>

        }

function statErrCount(errors, range){
  const dates = rangeDates(range);
  return errors.filter(e=>dates.includes(e.date)).length;
}

function setErrFilter(f){ currentErrFilter = f; renderMain(); }

function toggleRec(id){
  const btn = document.getElementById('recBtn');
  const status = document.getElementById('recStatus');
  if(!voiceRec){
    if(!navigator.mediaRecorder){
      voiceTimer = setInterval(()=>{ voiceSeconds++; status.textContent='录音中... '+voiceSeconds+'s'; }, 1000);
      btn.classList.add('recording'); btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="#fff" rx="2"/></svg>';
      voiceRec = 'simulated'; return;
    }
    navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
      voiceRec = new MediaRecorder(stream); voiceChunks = [];
      voiceRec.ondataavailable = e=>voiceChunks.push(e.data);
      voiceRec.onstop = ()=>{ pendingVoiceBlob = new Blob(voiceChunks, {type:'audio/webm'}); stream.getTracks().forEach(t=>t.stop()); autoTranscribe(); };
      voiceRec.start();
      voiceTimer = setInterval(()=>{ voiceSeconds++; status.textContent='录音中... '+voiceSeconds+'s'; }, 1000);
      btn.classList.add('recording'); btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="#fff" rx="2"/></svg>';
    }).catch(()=>{
      voiceTimer = setInterval(()=>{ voiceSeconds++; status.textContent='录音中... '+voiceSeconds+'s'; }, 1000);
      btn.classList.add('recording'); btn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" fill="#fff" rx="2"/></svg>';
      voiceRec = 'simulated';
    });
  }else{
    if(voiceRec==='simulated'){ voiceRec = null; clearInterval(voiceTimer); pendingVoiceBlob = 'simulated'; autoTranscribe(); }
    else{ voiceRec.stop(); voiceRec = null; clearInterval(voiceTimer); }
    btn.classList.remove('recording'); btn.innerHTML = ICONS.mic;
    status.textContent = '录音结束 · '+voiceSeconds+'s';
  }
}

function stopRec(){ if(voiceRec) toggleRec(); }

function autoTranscribe(){
  const ta = document.getElementById('errVoiceText'); if(!ta) return;
  if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR(); rec.lang = 'zh-CN'; rec.continuous = false; rec.interimResults = false;
    const status = document.getElementById('recStatus'); if(status) status.textContent='正在转文字...';
    rec.onresult = e=>{ ta.value = e.results[0][0].transcript; if(status) status.textContent='转文字完成'; };
    rec.onerror = ()=>{ if(status) status.textContent='转文字失败，请手动输入'; };
    rec.onend = ()=>{ if(!ta.value && status) status.textContent='转文字未识别，请手动输入'; };
    try{ rec.start(); }catch(e){ if(status) status.textContent='录音结束，可手动编辑'; }
  }else{
    const status = document.getElementById('recStatus');
    if(status) status.textContent='录音结束，浏览器不支持自动转文字，请手动输入';
  }
}

function addDuration(id){
  const startInput = document.getElementById('durStart_'+id);
  const endInput = document.getElementById('durEnd_'+id);
  const start = startInput.value;
  const end = endInput.value;
  if(!start || !end){ toast('请填写开始和结束时间'); return; }
  // Calculate minutes
  const [sh, sm] = start.split(':').map(Number);
  const [eh, em] = end.split(':').map(Number);
  let min = (eh*60+em) - (sh*60+sm);
  if(min <= 0){ toast('结束时间需晚于开始时间'); return; }
  const md = getModuleData(id);
  if(!md.durations) md.durations = [];
  md.durations.push({ id:'d'+Date.now(), date:todayStr(), start, end, min });
  saveDB();
  endInput.value='';
  renderMain();
  toast('打卡成功！' + start + '-' + end + ' 共' + min + '分钟');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(data.navOrder) DB.navOrder = data.navOrder;
      if(data.countdowns) DB.countdowns = [...DB.countdowns, ...data.countdowns];
      if(data.modules){
        Object.keys(data.modules).forEach(id=>{
          if(!DB.modules[id]) DB.modules[id] = { stats:[], plans:[], errors:[], durations:[], lifeRecords:[] };
          DB.modules[id].stats = [...(DB.modules[id].stats||[]), ...(data.modules[id].stats||[])];
          DB.modules[id].plans = [...(DB.modules[id].plans||[]), ...(data.modules[id].plans||[])];
          DB.modules[id].errors = [...(DB.modules[id].errors||[]), ...(data.modules[id].errors||[])];
          DB.modules[id].durations = [...(DB.modules[id].durations||[]), ...(data.modules[id].durations||[])];
          DB.modules[id].lifeRecords = [...(DB.modules[id].lifeRecords||[]), ...(data.modules[id].lifeRecords||[])];
        });
      }
      // 导入后补全 navOrder 中缺失的模块（兼容旧备份）
      const allIds = MODULES.map(m=>m.id);
      allIds.forEach(mid=>{
        if(!DB.navOrder.includes(mid)){
          const m = MODULES.find(x=>x.id===mid);
          const sameGroup = DB.navOrder.filter(id => MODULES.find(x=>x.id===id && x.group===m.group));
          if(sameGroup.length > 0){
            const lastIdx = DB.navOrder.lastIndexOf(sameGroup[sameGroup.length-1]);
            DB.navOrder.splice(lastIdx+1, 0, mid);
          }else{
            DB.navOrder.push(mid);
          }
        }
      });
      // 确保每个模块都有完整数据结构
      MODULES.forEach(m=>{
        if(!DB.modules[m.id]) DB.modules[m.id] = { stats:[], plans:[], errors:[], durations:[], lifeRecords:[] };
        if(!DB.modules[m.id].durations) DB.modules[m.id].durations = [];
        if(!DB.modules[m.id].lifeRecords) DB.modules[m.id].lifeRecords = [];
      });
      saveDB(); closeModal(); renderNav(); renderMain();
      toast('数据导入成功～');
    }catch(err){ toast('导入失败：文件格式错误'); }
  };
  reader.readAsText(file);
}

// ===== GitHub 云同步 =====
const GH_REPO = 'ivorylyn/wangsimu-study';
const GH_BRANCH = 'main';
const GH_DATA_FILE = 'data.json';
let syncTimer = null;

function ghApi(path, method, body){
  const token = DB.githubToken;
  if(!token) return Promise.reject('未绑定 Token');
  const opts = {
    method: method||'GET',
    headers: {
      'Authorization': 'Bearer '+token,
      'User-Agent': 'wangsimu-study',
      'Accept': 'application/vnd.github+json'
    }
  };
  if(body){
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  return fetch('https://api.github.com/repos/'+GH_REPO+'/contents/'+path, opts).then(r=>r.json());
}

function bindToken(){
  const token = document.getElementById('tokenInput').value.trim();
  if(!token || !token.startsWith('github_pat_')){ toast('请输入有效的 Token（github_pat_ 开头）'); return; }
  DB.githubToken = token;
  DB.autoSync = true;
  saveDB();
  updateSyncUI();
  toast('Token 已绑定，正在拉取云端数据...');
  cloudPullOnly().then(()=>{
    toast('云端数据已同步到本地～');
    closeModal();
  }).catch(()=>{
    toast('Token 验证通过，暂无云端数据');
    closeModal();
  });
}

function removeToken(){
  showConfirm('确定解绑 Token 吗？解绑后需重新绑定才能同步', ()=>{
    delete DB.githubToken;
    DB.autoSync = false;

    closeModal();
    toast('Token 已解绑');
  });
}

function toggleAutoSync(){
  DB.autoSync = !DB.autoSync;
  saveDB();

}

function cloudPush(){
  if(!DB.githubToken) return Promise.reject('未绑定 Token');
  updateSyncText('正在上传...', 'syncing');
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(DB, null, 2))));
  return ghApi(GH_DATA_FILE, 'GET').then(meta=>{
    const payload = { message:'sync: '+todayStr()+' '+timeStr(), content, branch:GH_BRANCH };
    if(meta.sha) payload.sha = meta.sha;
    return ghApi(GH_DATA_FILE, 'PUT', payload);
  }).then(r=>{
    if(r.commit){
      DB.lastSync = todayStr()+' '+timeStr();
      saveDB();
      updateSyncText('已同步 · '+timeStr(), 'synced');
      return r;
    }
    throw r.message||'上传失败';
  }).catch(e=>{
    updateSyncText('同步失败 · '+String(e).slice(0,20), 'error');
    throw e;
  });
}

function cloudPullOnly(){
  if(!DB.githubToken) return Promise.reject('未绑定 Token');
  updateSyncText('正在拉取...', 'syncing');
  return ghApi(GH_DATA_FILE, 'GET').then(meta=>{
    if(!meta.content) throw '云端暂无数据';
    const cloudData = JSON.parse(decodeURIComponent(escape(atob(meta.content.replace(/\n/g,'')))));
    // 合并：以云端为准，但保留本地 Token
    const savedToken = DB.githubToken;
    const savedAutoSync = DB.autoSync;
    DB = cloudData;
    DB.githubToken = savedToken;
    DB.autoSync = savedAutoSync;
    if(!DB.navOrder) DB.navOrder = MODULES.map(m=>m.id);
    if(!DB.modules) DB.modules = {};
    if(!DB.countdowns) DB.countdowns = [];
    saveDB();
    renderNav(); renderMain();
    updateSyncText('已拉取 · '+timeStr(), 'synced');
    return meta;
  }).catch(e=>{
    if(String(e).includes('404') || String(e).includes('暂无')){
      updateSyncText('云端暂无数据', 'local');
    }else{
      updateSyncText('拉取失败', 'error');
    }
    throw e;
  });
}

function cloudSyncNow(){
  toast('正在同步...');
  cloudPullOnly().then(()=>{
    return cloudPush();
  }).then(()=>{
    toast('✅ 云端同步完成');
  }).catch(e=>{
    // 拉取失败可能是云端没数据，直接上传
    cloudPush().then(()=>{
      toast('✅ 数据已上传到云端');
    }).catch(e2=>{
      toast('同步失败：'+String(e2).slice(0,30));
    });
  });
}

function scheduleAutoPush(){
  if(!DB.githubToken || !DB.autoSync) return;
  if(syncTimer) clearTimeout(syncTimer);
  syncTimer = setTimeout(()=>{
    cloudPush().catch(()=>{});
  }, 5000);
}

function updateSyncText(text, state){
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if(!dot || !txt) return;
  txt.textContent = text;
  const colors = {synced:'var(--green)', syncing:'var(--orange)', error:'var(--red)', local:'#ccc'};
  dot.style.background = colors[state] || '#ccc';
  dot.style.boxShadow = state==='synced' ? '0 0 0 3px rgba(127,209,168,.25)' : 'none';
}

function updateSyncUI(){

function checkBackupPrompt(){
  const count = Object.values(DB.modules).reduce((a,m)=>{
    return a + (m.stats?.length||0) + (m.plans?.length||0) + (m.errors?.length||0) + (m.durations?.length||0) + (m.lifeRecords?.length||0);
  },0) + DB.countdowns.length;
  if(count>=30 && Date.now()-lastBackupPrompt>600000){
    lastBackupPrompt = Date.now(); toast('数据已积累 '+count+' 条，建议导出备份');

}

function calcFood(id){
  const name = document.getElementById('foodName_'+id).value.trim();
  const weight = parseFloat(document.getElementById('foodWeight_'+id).value)||0;
  let cal = '';
  if(name && weight){
    const key = Object.keys(FOOD_CALORIES).find(k=>name.includes(k)) || Object.keys(FOOD_CALORIES).find(k=>k.includes(name));
    if(key) cal = Math.round(FOOD_CALORIES[key] * weight / 100);
  }
  document.getElementById('foodCal_'+id).value = cal;
}

function renderLens(id, m){
  const md = getModuleData(id);
  const all = (md.lifeRecords||[]).filter(r=>r.type==='lens').sort((a,b)=>{
    const ea = r.openDate ? calcLensExpireDate(r.openDate, r.duration) : '';
    const eb = r.openDate ? calcLensExpireDate(r.openDate, r.duration) : '';
    return (eb||'').localeCompare(ea||'');
  });
  const today = todayStr();

  const items = all.map(r=>{
    const expire = r.openDate ? calcLensExpireDate(r.openDate, r.duration) : '';
    const daysLeft = expire ? Math.ceil((new Date(expire) - new Date(today)) / 86400000) : null;
    let cls = '', daysText = '';
    if(daysLeft !== null){
      if(daysLeft < 0){ cls = 'expired'; daysText = `已过期 ${Math.abs(daysLeft)} 天`; }
      else if(daysLeft <= 14){ cls = 'warn'; daysText = `剩余 ${daysLeft} 天`; }
      else { daysText = `剩余 ${daysLeft} 天`; }
    }
    return `<div class="lens-item ${cls}">
      <div class="li-main">
        <div class="li-model">${escapeHtml(r.model||'未命名')}（有效期 ${r.duration||0} 天）</div>
        <div class="li-date">开封 ${r.openDate||'-'} → 过期 ${expire||'-'}${r.note?' · '+escapeHtml(r.note):''}</div>
      </div>
      <span class="li-days">${daysText}</span>
      <button class="d-del" onclick="delLifeRecord('${id}','${r.id}')">删除</button>
    </div>`;
  }).join('');

  return `
    <div class="card">
      <div class="card-title">${ICONS.eye}美瞳有效期<span class="tail">共${all.length}副</span></div>
      <div class="health-form-row">
        <div class="health-form-field">
          <label>型号</label>
          <input type="text" id="lensModel_${id}" placeholder="如海昌月抛棕">
        </div>
        <div class="health-form-field">

function calcLensExpireDate(openDate, duration){
  if(!openDate || !duration) return '';
  const d = new Date(openDate);
  d.setDate(d.getDate() + parseInt(duration));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function saveLens(id){
  const model = document.getElementById('lensModel_'+id).value.trim();
  const openDate = document.getElementById('lensOpen_'+id).value;
  const duration = parseInt(document.getElementById('lensDuration_'+id).value)||0;
  const note = document.getElementById('lensNote_'+id).value.trim();
  if(!model){ toast('请填写型号'); return; }
  if(!openDate){ toast('请选择开封日期'); return; }
  if(!duration || duration<=0){ toast('请填写有效天数'); return; }
  const md = getModuleData(id);
  md.lifeRecords.push({ id:'l'+Date.now(), date:todayStr(), type:'lens', model, openDate, duration, note });
  saveDB(); renderMain();
  toast('美瞳记录已保存～');
}

// ===== 收支明细（记账本）=====
const FIN_CATS = {
  expense: ['餐饮','交通','购物','居住','娱乐','医疗','学习','其他'],
  income: ['工资','兼职','红包','理财','奖学金','其他']
};

function periodLabel(){
  if(finPeriod==='day') return '今日';
  if(finPeriod==='month') return '本月';
  return '本年';
}
function periodMatch(dateStr){
  const t = new Date();
  if(finPeriod==='day') return dateStr === todayStr();
  const ym = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');
  if(finPeriod==='month') return dateStr && dateStr.startsWith(ym);
  return dateStr && dateStr.startsWith(String(t.getFullYear()));
}

function renderFinance(id, m){
  const md = getModuleData(id);
  const all = (md.lifeRecords||[]).filter(r=>r.type==='finance');
  const cur = all.filter(r=>periodMatch(r.date));
  const inc = cur.filter(r=>r.kind==='income').reduce((a,r)=>a+(r.amount||0),0);
  const exp = cur.filter(r=>r.kind==='expense').reduce((a,r)=>a+(r.amount||0),0);
  const balance = inc - exp;

  // group by date
  const dateMap = {};
  all.slice().reverse().forEach(r=>{
    if(!dateMap[r.date]) dateMap[r.date] = [];
    dateMap[r.date].push(r);
  });
  const dates = Object.keys(dateMap).sort((a,b)=>b.localeCompare(a));

  const dayTitle = (d)=>{
    const t = todayStr();
    return d===t ? '今天' : d;
  };
  const renderDay = (d, records)=>{
    const dayInc = records.filter(r=>r.kind==='income').reduce((a,r)=>a+(r.amount||0),0);
    const dayExp = records.filter(r=>r.kind==='expense').reduce((a,r)=>a+(r.amount||0),0);
    const items = records.map(r=>`
      <div class="fin-item">
        <div class="fin-info">
          <div class="fin-cat">${escapeHtml(r.category||'未分类')}${r.note?` <span class="fin-note">${escapeHtml(r.note)}</span>`:''}</div>
          <div class="fin-date">${r.time||''}</div>
        </div>
        <div class="fin-amt ${r.kind==='income'?'income':'expense'}">${r.kind==='income'?'+':'−'}¥${formatMoney(r.amount)}</div>
        <button class="fin-edit" onclick="editFinance('${id}','${r.id}')">${ICONS.edit}</button>
        <button class="fin-del" onclick="delFinance('${id}','${r.id}')">${ICONS.del}</button>
      </div>`).join('');
    return `
      <div class="fin-day">
        <div class="fin-day-head" onclick="toggleFinDay(this)">
          <div style="display:flex;align-items:center;gap:6px">
            <span class="fin-day-title">${dayTitle(d)}</span>
            <span class="fin-day-count">${records.length}笔</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="fin-day-sum income">+¥${formatMoney(dayInc)}</span>
            <span class="fin-day-sum expense">−¥${formatMoney(dayExp)}</span>
            <span class="fin-day-arrow">${ICONS.down}</span>
          </div>
        </div>
        <div class="fin-day-body">${items}</div>
      </div>
    `;
  };
  const maxDays = 3;
  const needCollapse = dates.length > maxDays;
  const dayHtml = dates.map(d=>renderDay(d, dateMap[d]));

  const editRec = finEditId ? all.find(r=>r.id===finEditId) : null;
  const formKind = editRec ? editRec.kind : finKind;

  return `
    <div class="card">
      <div class="card-title">${ICONS.wallet}收支明细<span class="tail">记账本</span></div>
      <div class="fin-period">
        <div class="fin-tab ${finPeriod==='day'?'active':''}" onclick="setFinPeriod('day')">日</div>
        <div class="fin-tab ${finPeriod==='month'?'active':''}" onclick="setFinPeriod('month')">月</div>
        <div class="fin-tab ${finPeriod==='year'?'active':''}" onclick="setFinPeriod('year')">年</div>
      </div>
      <div class="fin-stats">
        <div class="fin-stat">
          <div class="fin-stat-label">${periodLabel()}总收入</div>
          <div class="fin-stat-num income">¥${formatMoney(inc)}</div>
        </div>
        <div class="fin-stat">
          <div class="fin-stat-label">${periodLabel()}总支出</div>
          <div class="fin-stat-num expense">¥${formatMoney(exp)}</div>
        </div>
      </div>
      <div class="fin-balance">
        <span>${periodLabel()}结余</span>
        <b class="${balance>=0?'income':'expense'}">¥${formatMoney(balance)}</b>
      </div>
    </div>

    <div class="card">
      <div class="card-title">${ICONS.edit}${editRec?'编辑记录':'记一笔'}</div>
      <div class="fin-period">
        <div class="fin-tab ${formKind==='expense'?'active':''}" onclick="setFinKind('expense')">支出</div>
        <div class="fin-tab ${formKind==='income'?'active':''}" onclick="setFinKind('income')">收入</div>
      </div>
      <input list="finCats_${id}" id="finCat_${id}" placeholder="分类（如餐饮、工资）" value="${editRec?escapeHtml(editRec.category):''}" style="width:100%;border:1.5px solid var(--line);border-radius:var(--radius-xs);padding:9px 12px;font-size:14px;background:#fff;margin-bottom:8px">
      <datalist id="finCats_${id}">
        ${FIN_CATS[formKind].map(c=>`<option value="${c}">`).join('')}
      </datalist>
      <div class="fin-input-row">
        <input type="number" id="finAmt_${id}" class="fin-amt-input" placeholder="金额" min="0" step="0.01" value="${editRec?editRec.amount:''}">
        <input type="text" id="finNote_${id}" class="fin-note-input" placeholder="备注（选填）" value="${editRec?escapeHtml(editRec.note):''}">
      </div>
      <button class="add-card orange" onclick="saveFinance('${id}')"><span class="add-icon">${ICONS[finEditId?'check':'add']}</span><span class="add-text">${finEditId?'保存修改':'保存记录'}</span></button>
      ${finEditId?`<button class="add-card ash" onclick="cancelFinEdit()" style="margin-top:8px"><span class="add-icon">${ICONS.del}</span><span class="add-text">取消编辑</span></button>`:''}
    </div>

    <div class="card">
      <div class="card-title">${ICONS.clock}明细记录<span class="tail">共${all.length}条</span></div>
      <div class="fin-list">
        ${dates.length===0?'<div style="text-align:center;padding:14px;color:var(--text-mute);font-size:12px">还没有记账记录</div>':
          dayHtml.slice(0, maxDays).join('') + (needCollapse?`<div class="collapse-extra" style="display:none">${dayHtml.slice(maxDays).join('')}</div>`:'')
        }
      </div>
      ${needCollapse?`<button class="more-btn" onclick="toggleMore(this)"><span class="more-text">展开更多（共${dates.length}天）</span></button>`:''}
      ${all.length>0?`<button class="more-btn csv-btn" onclick="exportFinanceCSV('${id}')">${ICONS.down}导出CSV账单</button>`:''}
    </div>
  `;
}

function formatMoney(n){
  return (n||0).toLocaleString('zh-CN', {minimumFractionDigits:2, maximumFractionDigits:2});
}

function setFinPeriod(p){ finPeriod = p; renderMain(); }
function setFinKind(k){ if(finEditId) return; finKind = k; renderMain(); }

function saveFinance(id){
  const cat = document.getElementById('finCat_'+id).value.trim();
  const amt = parseFloat(document.getElementById('finAmt_'+id).value);
  const note = document.getElementById('finNote_'+id).value.trim();
  if(!cat){ toast('请填写分类'); return; }
  if(isNaN(amt) || amt<=0){ toast('请填写有效金额'); return; }
  const md = getModuleData(id);
  if(!md.lifeRecords) md.lifeRecords = [];
  const kind = finEditId ? (md.lifeRecords.find(r=>r.id===finEditId)||{}).kind : finKind;
  if(finEditId){
    const rec = md.lifeRecords.find(r=>r.id===finEditId);
    if(rec){ rec.category=cat; rec.amount=amt; rec.note=note; }
    finEditId = null;
    saveDB(); renderMain(); toast('已修改记录');
  }else{
    md.lifeRecords.push({ id:'l'+Date.now(), date:todayStr(), time:timeStr(), kind, category:cat, amount:amt, note, type:'finance' });
    saveDB(); renderMain(); toast('记账成功～');
  }
}

function editFinance(id, rid){
  finEditId = rid;
  renderMain();
}

function cancelFinEdit(){
  finEditId = null;
  renderMain();
}

function toggleFinDay(head){
  const day = head.closest('.fin-day');
  if(!day) return;
  day.classList.toggle('collapsed');
}

function delFinance(id, rid){
  showConfirm('确定删除这条记账记录吗？', ()=>{
    const md = getModuleData(id);
    md.lifeRecords = md.lifeRecords.filter(r=>r.id!==rid);
    if(finEditId===rid) finEditId = null;
    saveDB(); renderMain(); toast('已删除');
  });
}

function exportFinanceCSV(id){
  const md = getModuleData(id);
  const all = (md.lifeRecords||[]).filter(r=>r.type==='finance');
  if(all.length===0){ toast('没有可导出的记录'); return; }
  let csv = '日期,时间,类型,分类,金额,备注\n';
  all.slice().reverse().forEach(r=>{
    const type = r.kind==='income'?'收入':'支出';
    csv += `${r.date},${r.time||''},${type},"${r.category||''}",${r.amount},"${(r.note||'').replace(/"/g,'""')}"\n`;
  });
  const blob = new Blob(['\ufeff'+csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `收支明细_${todayStr()}.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('CSV账单已导出～');
}

function renderLifeHistory(id, type, title){
  const md = getModuleData(id);
  const today = todayStr();
  const allRecords = (md.lifeRecords||[]).filter(r=>r.type===type && r.date!==today);
  const dateMap = {};
  allRecords.forEach(r=>{
    if(!dateMap[r.date]) dateMap[r.date] = [];
    dateMap[r.date].push(r);
  });
  const dates = Object.keys(dateMap).sort((a,b)=>b.localeCompare(a)).slice(0,30);
  
  if(dates.length===0) return '';
  
  const items = dates.map(d=>{
    const dayRecords = dateMap[d];
    if(type==='food'){
      const dayTotal = dayRecords.reduce((a,r)=>a+(r.calories||0),0);
      return `<div class="history-day">
          <div class="history-day-head"><span class="history-date">${d}</span><span class="history-total">${dayTotal} 千卡</span></div>
          ${dayRecords.map(r=>`<div class="history-sub-item">${r.time||''} · ${r.name} ${r.weight}g · ${r.calories}千卡</div>`).join('')}
        </div>`;
    }else if(type==='fitness'){
      const dayTotal = dayRecords.reduce((a,r)=>a+(r.min||0),0);
      return `<div class="history-day">
          <div class="history-day-head"><span class="history-date">${d}</span><span class="history-total">${dayTotal} 分钟</span></div>
          ${dayRecords.map(r=>`<div class="history-sub-item">${r.time||''} · ${r.name} · ${r.min}分钟${r.note?' · '+r.note:''}</div>`).join('')}
        </div>`;
    }else if(type==='pill'){
      const slots = {早:[],午:[],晚:[]};
      dayRecords.forEach(r=>{ if(slots[r.slot]) slots[r.slot].push(r); });
      return `<div class="history-day">
          <div class="history-day-head"><span class="history-date">${d}</span><span class="history-total">${dayRecords.length} 项</span></div>
          ${['早','午','晚'].filter(s=>slots[s].length>0).map(s=>`<div class="history-sub-item"><b>${s}</b>：${slots[s].map(r=>`${r.time||''} ${r.name} ${r.dose||''}`).join('，')}</div>`).join('')}
        </div>`;
    }
    return '';
  });
  
  const maxShow = 5;
  const needCollapse = items.length > maxShow;
  return `
    <div class="card">
      <div class="card-title">${ICONS.clock}${title}<span class="tail">最近30天</span></div>
      <div class="history-list">
        ${items.slice(0, maxShow).join('')}
        ${needCollapse ? `<div class="collapse-extra" style="display:none">${items.slice(maxShow).join('')}</div>` : ''}
      </div>
      ${needCollapse ? `<button class="more-btn" onclick="toggleMore(this)"><span class="more-text">展开更多（共${items.length}天）</span></button>` : ''}
    </div>
  `;
}

function toggleMore(btn){
  const card = btn.closest('.card');
  if(!card) return;
  const extra = card.querySelector('.collapse-extra');
  if(!extra) return;
  const isHidden = extra.style.display === 'none' || !extra.style.display;
  extra.style.display = isHidden ? 'block' : 'none';
  const txt = btn.querySelector('.more-text');
  if(txt) txt.textContent = isHidden ? '收起' : '展开更多';
}

function delLifeRecord(id, rid){
  const md = getModuleData(id);
  md.lifeRecords = md.lifeRecords.filter(r=>r.id!==rid);
  saveDB(); renderMain();
}
